  <article class="legalBody">

    <h2 id="t1">1. כללי</h2>
    <p>אתר זה מופעל על ידי <b>המעשנת</b> ("העסק"), ומשמש כקטלוג סיטונאי להצגת מוצרי סיגריות אלקטרוניות ואביזרים נלווים בפני בתי עסק.</p>
    <p>האתר אינו חנות מקוונת. לא ניתן לבצע בו רכישה, לא נגבה בו תשלום ואין בו סליקה. הצגת מוצר בקטלוג מהווה הזמנה להציע הצעה בלבד, ואינה מהווה הצעה מחייבת מצד העסק.</p>
    <p>כל שימוש באתר, לרבות גלישה ועיון בקטלוג, מהווה הסכמה לתנאים המפורטים במסמך זה. מי שאינו מסכים לתנאים מתבקש שלא לעשות שימוש באתר.</p>
    <p>האמור בתקנון זה מנוסח בלשון זכר מטעמי נוחות בלבד, ומתייחס לכל המינים כאחד.</p>

    <h2 id="t2">2. מכירה לבתי עסק ומגבלת גיל</h2>
    <div class="legalNote">
      <b>עסקים מורשים בלבד, מגיל 21 ומעלה</b>
      <p>הקטלוג מיועד לבתי עסק בעלי עוסק מורשה או חברה רשומה, לצורך רכישה סיטונאית לצורכי מסחר. אין מכירה ללקוח פרטי, ואין מכירה לשימוש עצמי.</p>
    </div>
    <p>מכירת מוצרי עישון, לרבות סיגריות אלקטרוניות, אסורה על פי דין למי שטרם מלאו לו 18 שנים, בהתאם לחוק הגבלת הפרסומת והשיווק של מוצרי טבק ומוצרי עישון. העסק בחר להחמיר ולהגביל את השימוש באתר ואת ההתקשרות עמו לבני 21 ומעלה בלבד.</p>
    <p>בכניסה לאתר ובאישור הודעת הגיל, המשתמש מצהיר כי מלאו לו 21 שנים וכי הוא פועל מטעם בית עסק. מסירת הצהרה כוזבת מהווה הפרה של תקנון זה.</p>
    <p>המוצרים מכילים ניקוטין. ניקוטין הוא חומר ממכר. העסק רשאי לדרוש הצגת אישור עוסק ותעודה מזהה בכל שלב, ולסרב להתקשרות ללא הנמקה.</p>

    <h2 id="t3">3. תנאי השימוש באתר</h2>
    <p>המשתמש מצהיר כי מלאו לו 21 שנים, כי הוא פועל מטעם בית עסק מורשה, וכי הפרטים שימסור בעת יצירת קשר יהיו נכונים ומלאים.</p>
    <p>אין לעשות באתר שימוש בלתי חוקי, לנסות לחדור למערכותיו, לשבש את פעילותו, או להשתמש בתכניו לצרכים מסחריים ללא אישור מראש ובכתב מהעסק.</p>

    <h2 id="t4">4. אופן ההזמנה</h2>
    <p>ההזמנה נעשית באמצעות פנייה בוואטסאפ למספר המופיע באתר, או בכל דרך אחרת שיסכימו עליה הצדדים. פנייה ראשונית אינה מהווה הזמנה מחייבת.</p>
    <p>הזמנה נחשבת מאושרת רק לאחר שנציג העסק אישר אותה במפורש, לרבות אישור זמינות המלאי, הכמות, המחיר ומועד האספקה. עד לאישור כאמור לא נכרת חוזה בין הצדדים.</p>
    <p>המלאי והטעמים המוצגים באתר משקפים את המצב במועד עדכון הקטלוג ואינם התחייבות לזמינות. פריט המסומן כזמין עשוי להיגמר בין מועד העדכון למועד ההזמנה.</p>
    <p>התמונות בקטלוג הן להמחשה בלבד. ייתכנו הבדלים בין המוצג לבין המוצר בפועל, לרבות בגוון, באריזה ובעיצוב, בין היתר עקב שינויים מצד היצרן.</p>

    <h2 id="t5">5. מחירים ותשלום</h2>
    <p>המחירים בקטלוג הם מחירים סיטונאיים לבתי עסק ואינם כוללים מס ערך מוסף, אלא אם צוין אחרת במפורש.</p>
    <p>המחירים עשויים להשתנות בהתאם לכמות ההזמנה, למחירי הספקים ולשערי מטבע. המחיר המחייב הוא זה שאושר בכתב מול נציג בעת אישור ההזמנה.</p>
    <p>אמצעי התשלום, מועדי התשלום ותנאי האשראי ייקבעו מול הנציג בעת ההזמנה. אין באתר גבייה מקוונת ואין בו איסוף של פרטי אמצעי תשלום.</p>

    <h2 id="t6">6. אספקה ומסירה</h2>
    <p>אזורי החלוקה, מועדי האספקה ודמי המשלוח ייקבעו מול הנציג ויימסרו ללקוח בעת אישור ההזמנה.</p>
    <p>העסק אינו אחראי לעיכובים הנובעים מגורמים שאינם בשליטתו, ובכלל זה עיכובי ספקים או יבואנים, שביתות, מזג אוויר, מצב ביטחוני ותקלות של חברת השילוח.</p>
    <p>אחריות למסירת כתובת מדויקת ולקבלת הסחורה במועד שנקבע חלה על הלקוח. על הלקוח לבדוק את תכולת המשלוח בעת קבלתו ולדווח על חוסר או פגם נראה לעין בתוך 48 שעות ממועד המסירה.</p>

    <h2 id="t7">7. ביטול, החזרות והחלפות</h2>
    <div class="legalNote">
      <b>עסקה בין עוסקים</b>
      <p>זכויות הביטול הקבועות בחוק הגנת הצרכן חלות על צרכן פרטי. ההתקשרות מכוח קטלוג זה היא בין עוסקים, ולכן תנאי הביטול וההחזרה הם אלה המפורטים להלן ואלה שסוכמו בכתב מול הנציג.</p>
    </div>
    <p>ביטול הזמנה שאושרה אפשרי בהסכמת העסק ובלבד שטרם יצאה לאספקה. הזמנה שסופקה אינה ניתנת לביטול, למעט במקרים המפורטים בסעיף האחריות.</p>
    <p>מטעמי היגיינה ובטיחות, מוצרי אידוי חד־פעמיים, נוזלים ופודים שאריזתם המקורית נפתחה אינם ניתנים להחזרה או להחלפה, אלא אם נמצא בהם פגם ייצור.</p>
    <p>החזרת סחורה תקינה, ככל שאושרה על ידי העסק, תיעשה באריזתה המקורית ובמצב סחיר, ועלות ההחזרה תחול על הלקוח.</p>

    <h2 id="t8">8. אחריות למוצרים</h2>
    <p>האחריות למוצרים היא אחריות היצרן או היבואן, בהתאם לתנאים הנלווים לכל מוצר. העסק ישמש כמתווך מול הספק בטיפול בפניות אחריות.</p>
    <p>מוצר שנמצא בו פגם ייצור יוחלף או יזוכה בהתאם למדיניות הספק, ובכפוף לבדיקה. האחריות אינה חלה על נזק שנגרם משימוש שאינו לפי הוראות היצרן, מחשיפה לנוזלים, מנפילה, מפירוק, או מאחסון בתנאים בלתי נאותים.</p>
    <p>הלקוח אחראי לאחסון הסחורה בבית העסק שלו בתנאים נאותים ולמכירתה בהתאם לדין החל, לרבות איסור מכירה לקטינים והוראות הסימון והפרסום.</p>

    <h2 id="t9">9. פרטיות ומידע שנאסף</h2>
    <p>האתר אינו כולל טופס הרשמה, אינו מנהל חשבונות משתמשים ואינו אוסף פרטים מזהים מהגולשים.</p>
    <p>פנייה בוואטסאפ מעבירה לעסק את מספר הטלפון ואת תוכן ההודעה. מידע זה משמש לצורך הטיפול בפנייה ובהזמנה בלבד, ואינו נמסר לצד שלישי למעט לצורך אספקת ההזמנה או כנדרש על פי דין.</p>
    <p>הגדרות מקומיות שנשמרות בדפדפן המשתמש נשמרות במכשירו בלבד ואינן מועברות לעסק.</p>
    <p>שירות הוואטסאפ מופעל בידי צד שלישי וכפוף למדיניות הפרטיות שלו.</p>

    <h2 id="t10">10. קניין רוחני</h2>
    <p>העיצוב, הטקסטים, הקוד והלוגו של האתר הם רכושו של העסק ומוגנים בדיני זכויות יוצרים וסימני מסחר. אין להעתיקם, לשכפלם או לעשות בהם שימוש מסחרי ללא אישור מראש ובכתב.</p>
    <p>שמות המותגים, סימני המסחר ותמונות המוצרים המופיעים בקטלוג הם רכושם של בעליהם, ומוצגים לצורכי זיהוי המוצרים המוצעים בלבד. הצגתם אינה מהווה טענה לבעלות ואינה מעידה על קשר או חסות מצד בעלי הסימנים.</p>

    <h2 id="t11">11. הגבלת אחריות</h2>
    <p>העסק עושה מאמץ לוודא את דיוק המידע בקטלוג, אולם המידע מבוסס בין היתר על נתוני יצרנים ויבואנים, וייתכנו בו טעויות או אי דיוקים. בכל מקרה של סתירה בין המוצג באתר לבין המוצר בפועל, יש לפנות לנציג לפני ההזמנה.</p>
    <p>אחריות העסק בכל מקרה מוגבלת לסכום ששולם בפועל עבור ההזמנה הספציפית שבמחלוקת. העסק לא יישא בנזק עקיף, תוצאתי או מיוחד, לרבות אובדן רווח או פגיעה במוניטין.</p>
    <p>העסק אינו אחראי לתקלות טכניות באתר, להפסקות בזמינותו או לנזק שמקורו בגורם חיצוני. השימוש במוצרים הוא באחריות המשתמש הסופי בלבד.</p>

    <h2 id="t12">12. שינויים בתקנון</h2>
    <p>העסק רשאי לעדכן תקנון זה מעת לעת. הנוסח המחייב הוא הנוסח המפורסם באתר במועד השימוש. המשך שימוש באתר לאחר עדכון מהווה הסכמה לנוסח המעודכן.</p>

    <h2 id="t13">13. דין וסמכות שיפוט</h2>
    <p>על תקנון זה ועל כל התקשרות מכוחו יחולו דיני מדינת ישראל בלבד. סמכות השיפוט הבלעדית בכל מחלוקת נתונה לבתי המשפט המוסמכים בישראל.</p>

    <h2 id="t14">14. יצירת קשר</h2>
    <p>לשאלות בנוגע לתקנון, להזמנות או לשירות, ניתן לפנות בוואטסאפ למספר המופיע באתר.</p>
